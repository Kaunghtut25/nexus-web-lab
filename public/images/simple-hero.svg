<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#EFF6FF"/><stop offset="100%" stop-color="#F8FAFC"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#0891B2"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="600" height="300" rx="20" fill="url(#bg)"/>
  <!-- Laptop -->
  <g filter="url(#sh)">
    <rect x="40" y="30" width="520" height="220" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Screen -->
    <rect x="52" y="42" width="496" height="170" rx="8" fill="#0F172A"/>
    <!-- Header nav -->
    <rect x="52" y="42" width="496" height="32" rx="8" fill="#1E293B"/>
    <rect x="52" y="58" width="496" height="16" fill="#1E293B"/>
    <text x="72" y="62" font-family="sans-serif" font-size="10" fill="#3B82F6" font-weight="bold">Nexus Web Lab</text>
    <text x="450" y="62" font-family="sans-serif" font-size="9" fill="#94A3B8">Home  Services  About  Contact</text>
    <rect x="520" y="55" width="22" height="14" rx="6" fill="url(#blue)"/>
    <!-- Hero section -->
    <rect x="72" y="88" width="280" height="14" rx="7" fill="white" opacity="0.9"/>
    <rect x="72" y="112" width="200" height="6" rx="3" fill="#64748B" opacity="0.5"/>
    <rect x="72" y="126" width="240" height="6" rx="3" fill="#64748B" opacity="0.4"/>
    <rect x="72" y="140" width="120" height="20" rx="10" fill="url(#blue)" opacity="0.6"/>
    <!-- Right side visual -->
    <rect x="400" y="88" width="135" height="110" rx="10" fill="#1E293B"/>
    <rect x="415" y="102" width="105" height="6" rx="3" fill="url(#blue)" opacity="0.5"/>
    <rect x="415" y="118" width="80" height="4" rx="2" fill="#64748B" opacity="0.3"/>
    <rect x="415" y="128" width="95" height="4" rx="2" fill="#64748B" opacity="0.25"/>
    <rect x="415" y="138" width="70" height="4" rx="2" fill="#64748B" opacity="0.2"/>
    <rect x="415" y="148" width="90" height="14" rx="7" fill="url(#purple)" opacity="0.4"/>
    <rect x="415" y="172" width="75" height="4" rx="2" fill="#64748B" opacity="0.2"/>
    <!-- Stats -->
    <rect x="72" y="175" width="80" height="28" rx="8" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
    <text x="112" y="193" font-family="sans-serif" font-size="14" fill="url(#blue)" font-weight="bold" text-anchor="middle">5+</text>
    <rect x="160" y="175" width="80" height="28" rx="8" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
    <text x="200" y="193" font-family="sans-serif" font-size="14" fill="url(#cyan)" font-weight="bold" text-anchor="middle">3+</text>
    <rect x="248" y="175" width="80" height="28" rx="8" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
    <text x="288" y="193" font-family="sans-serif" font-size="14" fill="url(#purple)" font-weight="bold" text-anchor="middle">100%</text>
  </g>
</svg>
