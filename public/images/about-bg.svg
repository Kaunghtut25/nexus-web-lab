<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F5F3FF"/><stop offset="100%" stop-color="#F8FAFC"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="600" height="240" rx="16" fill="url(#bg)"/>
  
  <!-- Desk scene -->
  <g filter="url(#sh)">
    <rect x="160" y="50" width="280" height="160" rx="14" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Monitor -->
    <rect x="190" y="70" width="220" height="110" rx="8" fill="#0F172A"/>
    <rect x="200" y="80" width="200" height="14" rx="7" fill="#3B82F6" opacity="0.5"/>
    <rect x="200" y="104" width="140" height="5" rx="2.5" fill="#64748B" opacity="0.3"/>
    <rect x="200" y="117" width="180" height="5" rx="2.5" fill="#64748B" opacity="0.25"/>
    <rect x="200" y="130" width="120" height="5" rx="2.5" fill="#64748B" opacity="0.2"/>
    <rect x="200" y="145" width="160" height="18" rx="9" fill="url(#blue)" opacity="0.5"/>
    <!-- Monitor stand -->
    <rect x="275" y="182" width="50" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="270" y="188" width="60" height="4" rx="2" fill="#94A3B8"/>
    <!-- Keyboard -->
    <rect x="200" y="196" width="180" height="10" rx="5" fill="#E2E8F0"/>
    <!-- Plant -->
    <circle cx="150" cy="190" r="12" fill="#4ADE80"/>
    <circle cx="140" cy="182" r="10" fill="#22C55E"/>
    <circle cx="158" cy="178" r="9" fill="#16A34A"/>
    <rect x="148" y="198" width="4" height="14" rx="2" fill="#78350F"/>
    <!-- Coffee -->
    <rect x="440" y="185" width="28" height="22" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="444" y="189" width="20" height="10" rx="4" fill="#78350F" opacity="0.7"/>
    <!-- Notepad -->
    <rect x="80" y="175" width="50" height="40" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="90" y1="185" x2="120" y2="185" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="90" y1="192" x2="115" y2="192" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="90" y1="199" x2="105" y2="199" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
</svg>
