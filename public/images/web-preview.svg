<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FAF5FF"/><stop offset="100%" stop-color="#F8FAFC"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="600" height="300" rx="20" fill="url(#bg)"/>
  
  <!-- Dashboard mockup -->
  <g filter="url(#sh)">
    <rect x="20" y="15" width="560" height="270" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Top bar -->
    <rect x="20" y="15" width="560" height="40" rx="16" fill="#0F172A"/>
    <rect x="20" y="38" width="560" height="17" fill="#0F172A"/>
    <text x="44" y="40" font-family="sans-serif" font-size="12" fill="white" font-weight="bold">Nexus Web Lab Dashboard</text>
    <circle cx="540" cy="35" r="5" fill="#3B82F6"/>
    
    <!-- Sidebar -->
    <rect x="36" y="70" width="100" height="200" rx="8" fill="#F8FAFC"/>
    <rect x="48" y="82" width="76" height="6" rx="3" fill="#3B82F6" opacity="0.6"/>
    <rect x="48" y="98" width="65" height="4" rx="2" fill="#94A3B8" opacity="0.5"/>
    <rect x="48" y="110" width="80" height="4" rx="2" fill="#94A3B8" opacity="0.4"/>
    <rect x="48" y="122" width="60" height="4" rx="2" fill="#94A3B8" opacity="0.3"/>
    <rect x="48" y="140" width="76" height="6" rx="3" fill="#8B5CF6" opacity="0.4"/>
    <rect x="48" y="156" width="70" height="4" rx="2" fill="#94A3B8" opacity="0.3"/>
    <rect x="48" y="168" width="55" height="4" rx="2" fill="#94A3B8" opacity="0.2"/>
    
    <!-- Stats -->
    <rect x="155" y="70" width="130" height="50" rx="10" fill="#EFF6FF"/>
    <text x="220" y="93" font-family="sans-serif" font-size="20" fill="#3B82F6" font-weight="bold" text-anchor="middle">24</text>
    <text x="220" y="108" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Messages</text>
    
    <rect x="300" y="70" width="130" height="50" rx="10" fill="#ECFEFF"/>
    <text x="365" y="93" font-family="sans-serif" font-size="20" fill="#06B6D4" font-weight="bold" text-anchor="middle">6</text>
    <text x="365" y="108" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Services</text>
    
    <rect x="445" y="70" width="120" height="50" rx="10" fill="#F5F3FF"/>
    <text x="505" y="93" font-family="sans-serif" font-size="20" fill="#8B5CF6" font-weight="bold" text-anchor="middle">4</text>
    <text x="505" y="108" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Projects</text>
    
    <!-- Recent messages -->
    <rect x="155" y="135" width="410" height="55" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
    <text x="172" y="155" font-family="sans-serif" font-size="10" fill="#64748B" font-weight="bold">Recent Messages</text>
    <rect x="172" y="164" width="250" height="4" rx="2" fill="#3B82F6" opacity="0.4"/>
    <rect x="172" y="174" width="200" height="3" rx="1.5" fill="#94A3B8" opacity="0.3"/>
    <rect x="172" y="182" width="230" height="3" rx="1.5" fill="#94A3B8" opacity="0.2"/>
    
    <!-- Table -->
    <rect x="155" y="205" width="410" height="60" rx="10" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
    <rect x="180" y="220" width="80" height="6" rx="3" fill="#3B82F6" opacity="0.5"/>
    <rect x="180" y="234" width="100" height="4" rx="2" fill="#94A3B8" opacity="0.3"/>
    <rect x="280" y="220" width="120" height="6" rx="3" fill="#64748B" opacity="0.4"/>
    <rect x="280" y="234" width="90" height="4" rx="2" fill="#94A3B8" opacity="0.25"/>
    <rect x="420" y="220" width="60" height="6" rx="3" fill="#22C55E" opacity="0.6"/>
    <rect x="420" y="234" width="40" height="4" rx="2" fill="#94A3B8" opacity="0.2"/>
  </g>
</svg>
