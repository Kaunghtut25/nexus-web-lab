<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="aGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="50%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#00BCD4"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#4DD0E1"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="200" r="180" fill="url(#aGrad)" opacity="0.08"/>
  <circle cx="256" cy="200" r="160" fill="url(#aGrad)" opacity="0.06"/>
  
  <!-- Stylized A - Main shape -->
  <g transform="translate(256, 180)">
    <!-- Left leg of A -->
    <polygon points="-120,120 -60,-140 -10,-140 -50,120" fill="#0D47A1"/>
    <!-- Right leg of A -->
    <polygon points="120,120 60,-140 10,-140 50,120" fill="#1565C0"/>
    <!-- Cross bar -->
    <rect x="-70" y="-10" width="140" height="24" rx="12" fill="#0D47A1"/>
    
    <!-- Cyan wave/swoosh flowing through middle -->
    <path d="M-130,50 Q-65,-20 0,20 Q65,60 130,-10" stroke="url(#waveGrad)" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M-130,50 Q-65,-20 0,20 Q65,60 130,-10" stroke="#00BCD4" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
    
    <!-- Top dot/accent -->
    <circle cx="0" cy="-110" r="10" fill="#00BCD4" opacity="0.8"/>
  </g>
  
  <!-- Brand text -->
  <text x="256" y="405" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="64" fill="#0D47A1" letter-spacing="6">azami</text>
  <text x="256" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="16" fill="#1565C0" letter-spacing="8">TRAINING CENTER</text>
</svg>
