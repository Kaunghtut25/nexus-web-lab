<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFFF"/>
      <stop offset="40%" style="stop-color:#0080FF"/>
      <stop offset="100%" style="stop-color:#003D99"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#003D99;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- J — geometric polygon style -->
  <g transform="translate(20,16)">
    <!-- Top bar (diagonal) -->
    <polygon points="0,8 52,0 52,20 0,28" fill="url(#lg)"/>
    <!-- Shine -->
    <polygon points="0,8 52,0 52,8 0,16" fill="url(#shine)" opacity="0.4"/>
    <!-- Stem (vertical-ish) -->
    <polygon points="52,0 72,8 72,64 52,72" fill="url(#lg)"/>
    <!-- Shine on stem -->
    <polygon points="52,0 56,2 56,68 52,72" fill="url(#shine)" opacity="0.3"/>
    <!-- Bottom curve hook -->
    <polygon points="72,64 56,72 56,80 0,80 0,60 40,60 56,60 56,64" fill="url(#lg)"/>
    <!-- Bottom shine -->
    <polygon points="56,60 40,60 0,60 0,68 40,68 56,68" fill="url(#shine)" opacity="0.15"/>
  </g>

  <!-- Dash symbol -->
  <g transform="translate(100,56)">
    <rect x="0" y="0" width="36" height="8" rx="4" fill="url(#lg)"/>
    <rect x="0" y="0" width="36" height="3" rx="2" fill="url(#shine)" opacity="0.4"/>
  </g>

  <!-- Company Name -->
  <text x="156" y="56" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="28" fill="#0f172a" letter-spacing="1">J RECRUIT</text>
  <text x="156" y="74" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="13" fill="#94a3b8" letter-spacing="6">CO., LTD.</text>

  <!-- Japanese -->
  <text x="156" y="96" font-family="'Hiragino Sans','Noto Sans JP',Arial,sans-serif" font-size="10" fill="#64748b" letter-spacing="2">株式会社Jリクルート</text>
</svg>
