    <rect x="52" y="168" width="90" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="52" y="178" width="140" height="6" rx="3" fill="url(#blue)" opacity="0.5"/>
  </g>
  
  <g filter="url(#sh)">
    <rect x="260" y="105" width="210" height="90" rx="12" fill="white"/>
