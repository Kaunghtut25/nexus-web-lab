  <text x="85" y="30" font-family="sans-serif" font-size="11" fill="#94A3B8">nexusweblab.com</text>
  
  <!-- Section title -->
  <text x="30" y="85" font-family="sans-serif" font-size="14" fill="#0F172A" font-weight="bold">Our Services</text>
  
