<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E3A5F"/></linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#0891B2"/></linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22C55E"/><stop offset="100%" stop-color="#16A34A"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  
  <!-- Large circle decorations -->
  <circle cx="100" cy="100" r="300" fill="#3B82F6" opacity="0.05"/>
  <circle cx="1100" cy="500" r="250" fill="#06B6D4" opacity="0.05"/>
  
  <!-- Cards row — clear visible elements -->
  <g filter="url(#shadow)">
    <!-- Web Design card -->
    <rect x="620" y="80" width="200" height="220" rx="20" fill="#1E293B" opacity="0.95"/>
    <rect x="620" y="80" width="200" height="100" rx="20" fill="url(#card1)" opacity="0.8"/>
    <rect x="620" y="160" width="200" height="20" fill="url(#card1)" opacity="0.8"/>
    <circle cx="660" cy="110" r="18" fill="white" opacity="0.3"/>
    <text x="660" y="116" font-family="sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">🌐</text>
    <text x="660" y="148" font-family="sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Web Design</text>
    <rect x="640" y="175" width="120" height="4" rx="2" fill="white" opacity="0.4"/>
    <rect x="640" y="188" width="90" height="4" rx="2" fill="white" opacity="0.3"/>
    <rect x="640" y="201" width="110" height="4" rx="2" fill="white" opacity="0.25"/>
    <rect x="640" y="218" width="80" height="4" rx="2" fill="white" opacity="0.2"/>
  </g>
  
  <!-- SEO card -->
  <g filter="url(#shadow)">
    <rect x="840" y="120" width="200" height="220" rx="20" fill="#1E293B" opacity="0.95"/>
    <rect x="840" y="120" width="200" height="100" rx="20" fill="url(#card2)" opacity="0.75"/>
    <rect x="840" y="200" width="200" height="20" fill="url(#card2)" opacity="0.75"/>
    <circle cx="880" cy="150" r="18" fill="white" opacity="0.3"/>
    <text x="880" y="156" font-family="sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">📈</text>
    <text x="880" y="188" font-family="sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">SEO</text>
    <rect x="860" y="215" width="80" height="4" rx="2" fill="white" opacity="0.4"/>
    <rect x="860" y="228" width="100" height="4" rx="2" fill="white" opacity="0.3"/>
    <rect x="860" y="241" width="70" height="4" rx="2" fill="white" opacity="0.25"/>
  </g>
  
  <!-- Dev card -->
  <g filter="url(#shadow)">
    <rect x="720" y="200" width="180" height="200" rx="20" fill="#1E293B" opacity="0.95"/>
    <rect x="720" y="200" width="180" height="90" rx="20" fill="url(#card3)" opacity="0.7"/>
    <rect x="720" y="270" width="180" height="20" fill="url(#card3)" opacity="0.7"/>
    <circle cx="750" cy="225" r="16" fill="white" opacity="0.3"/>
    <text x="750" y="231" font-family="sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">💻</text>
    <text x="750" y="260" font-family="sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Development</text>
    <rect x="738" y="285" width="100" height="4" rx="2" fill="white" opacity="0.4"/>
    <rect x="738" y="298" width="70" height="4" rx="2" fill="white" opacity="0.3"/>
    <rect x="738" y="311" width="90" height="4" rx="2" fill="white" opacity="0.25"/>
  </g>
  
  <!-- Laptop illustration left side -->
  <g transform="translate(80,160)">
    <rect x="0" y="0" width="420" height="280" rx="24" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.2"/>
    <!-- Screen bezel -->
    <rect x="8" y="8" width="404" height="238" rx="16" fill="#0F172A"/>
    <!-- Screen glow -->
    <rect x="8" y="8" width="404" height="238" rx="16" fill="#3B82F6" opacity="0.03"/>
    <!-- Screen content -->
    <rect x="30" y="35" width="360" height="20" rx="10" fill="url(#card1)" opacity="0.5"/>
    <rect x="30" y="72" width="240" height="10" rx="5" fill="#64748B" opacity="0.4"/>
    <rect x="30" y="96" width="310" height="10" rx="5" fill="#64748B" opacity="0.3"/>
    <rect x="30" y="120" width="200" height="10" rx="5" fill="#64748B" opacity="0.25"/>
    <rect x="30" y="148" width="280" height="14" rx="7" fill="url(#card3)" opacity="0.4"/>
    <rect x="30" y="180" width="180" height="10" rx="5" fill="#64748B" opacity="0.2"/>
    <rect x="30" y="205" width="260" height="10" rx="5" fill="#64748B" opacity="0.15"/>
    <!-- Bottom bar -->
    <rect x="0" y="246" width="420" height="34" rx="24" fill="#334155"/>
    <rect x="0" y="256" width="420" height="24" fill="#334155"/>
  </g>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="596" width="1200" height="4" fill="url(#card1)"/>
</svg>
