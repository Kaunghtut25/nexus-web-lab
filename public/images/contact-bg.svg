<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#EFF6FF"/><stop offset="100%" stop-color="#F8FAFC"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="600" height="240" rx="16" fill="url(#bg)"/>
  
  <!-- Contact card -->
  <g filter="url(#sh)">
    <rect x="200" y="20" width="200" height="200" rx="16" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    
    <circle cx="300" cy="65" r="22" fill="#EFF6FF"/>
    <text x="300" y="71" font-family="sans-serif" font-size="22" text-anchor="middle">📩</text>
    
    <text x="300" y="105" font-family="sans-serif" font-size="14" fill="#0F172A" font-weight="bold" text-anchor="middle">Get in Touch</text>
    
    <rect x="220" y="120" width="160" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="220" y="134" width="120" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="220" y="148" width="140" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="220" y="162" width="100" height="6" rx="3" fill="#E2E8F0"/>
    
    <rect x="235" y="180" width="130" height="28" rx="14" fill="#3B82F6"/>
    <text x="300" y="199" font-family="sans-serif" font-size="11" fill="white" font-weight="bold" text-anchor="middle">Send Message →</text>
  </g>
  
  <!-- Phone icon floating -->
  <g filter="url(#sh)">
    <rect x="60" y="50" width="80" height="60" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <text x="100" y="72" font-family="sans-serif" font-size="10" fill="#0F172A" font-weight="bold" text-anchor="middle">📞</text>
    <text x="100" y="90" font-family="sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Call Us</text>
    <text x="100" y="103" font-family="sans-serif" font-size="8" fill="#64748B" text-anchor="middle">09 886 264 582</text>
  </g>
  
  <!-- Email floating -->
  <g filter="url(#sh)">
    <rect x="460" y="50" width="80" height="60" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <text x="500" y="72" font-family="sans-serif" font-size="10" fill="#0F172A" font-weight="bold" text-anchor="middle">✉️</text>
    <text x="500" y="90" font-family="sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Email Us</text>
    <text x="500" y="103" font-family="sans-serif" font-size="7" fill="#64748B" text-anchor="middle">kaunghtutmr@gmail.com</text>
  </g>
</svg>
