<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="line2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="120" rx="16" fill="url(#bg)"/>

  <!-- Decorative lines -->
  <rect x="20" y="20" width="60" height="3" rx="1.5" fill="url(#line1)"/>
  <rect x="20" y="96" width="40" height="3" rx="1.5" fill="url(#line2)"/>

  <!-- Icon — stylized N with connecting lines -->
  <g transform="translate(20,30)">
    <line x1="0" y1="10" x2="30" y2="50" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="10" x2="0" y2="50" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="15" cy="30" r="5" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="15" cy="30" r="2" fill="#ec4899"/>
  </g>

  <!-- Text -->
  <text x="85" y="52" font-family="Arial,sans-serif" font-weight="900" font-size="29" fill="#ffffff" letter-spacing="1">NEXUS</text>
  <text x="85" y="72" font-family="Arial,sans-serif" font-weight="400" font-size="16" fill="#93c5fd" letter-spacing="8">WEB LAB</text>

  <!-- Tagline -->
  <text x="85" y="92" font-family="Arial,sans-serif" font-size="9" fill="#64748b" letter-spacing="3">DIGITAL SOLUTIONS</text>
</svg>
